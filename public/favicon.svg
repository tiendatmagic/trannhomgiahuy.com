<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer golden border -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#fec200" stroke-width="5"/>
  <!-- Inner amber border and white background -->
  <circle cx="100" cy="100" r="88" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  
  <defs>
    <!-- Curve path for TRẦN NHÔM -->
    <path id="textPathTop" d="M 28,100 A 72,72 0 0,1 172,100" fill="none"/>
    <!-- Curve path for Stars -->
    <path id="textPathBottom" d="M 172,100 A 72,72 0 0,1 28,100" fill="none"/>
  </defs>
  
  <!-- Curved Text TRẦN NHÔM -->
  <text font-family="'Chakra Petch', sans-serif" font-weight="700" font-size="16" fill="#1c1917" text-anchor="middle">
    <textPath href="#textPathTop" startOffset="50%">TRẦN NHÔM</textPath>
  </text>
  
  <!-- Central GIA HUY text (Bold Green like the banner logo) -->
  <text x="100" y="112" font-family="'Chakra Petch', sans-serif" font-weight="800" font-size="30" fill="#047857" text-anchor="middle" letter-spacing="0.5">
    GIA HUY
  </text>
  
  <!-- Stars at the bottom -->
  <text font-family="sans-serif" font-weight="700" font-size="14" fill="#fec200" text-anchor="middle" dy="12">
    <textPath href="#textPathBottom" startOffset="50%">★★★</textPath>
  </text>
</svg>
